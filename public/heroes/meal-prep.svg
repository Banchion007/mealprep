<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mealPrepGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0a1a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#3b37a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c27700;stop-opacity:1" />
